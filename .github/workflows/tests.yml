name: Tests
on: [push, pull_request, workflow_dispatch]

jobs:
    test:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: tests
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: npm install

        # Two suites (parsePlayerList, playerList) import application source
        # that is not published in this repository, so they cannot run in CI.
        - name: Unit tests
          run: npx vitest run unit/token unit/validators unit/formatUptime unit/Boundary

        - name: Integration tests
          run: npm run test:integration
